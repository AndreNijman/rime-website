name: Deploy rimeos.com

# rimeos.com is deployed from here: on every push to main, and whenever a Rime
# release is published that the site does not have yet. An updated machine
# holds its what's-new page until /updates/<id> answers, so a release nobody
# wrote up used to be a page that never opened. Now:
#
#   · every 15 minutes, scripts/sync-releases.mjs --check-live asks rimeos.com
#     for the newest releases (rime-os holds no credential for this
#     repository, so the site looks rather than being told);
#   · a release with no record gets one written from its published image and
#     the pull requests merged since the one before (a record on main always
#     wins; a pull request's "## Release note" section gives its words);
#   · written records are kept on the `release-records` branch, so each is
#     written once, and the protected main is never pushed to;
#   · the same build and gates as CI, then wrangler, then the new pages are
#     checked live.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN: a Cloudflare API token
# with Account → Workers Scripts → Edit on the account in the repository
# variable CLOUDFLARE_ACCOUNT_ID. Nothing else.

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release-records branch only; main is protected by its ruleset
      actions: read     # rime-os's build-image runs (a job-level block drops every scope it does not name)
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Records written by earlier runs. `--skip-old-files`: a record on main
      # (hand-written, or one promoted from this branch) always wins.
      - name: Bring in the records written before
        run: |
          if git fetch --no-tags --depth=1 origin release-records 2>/dev/null; then
            git archive FETCH_HEAD content/updates | tar -x --skip-old-files
          fi
          ls content/updates | sort | tail -5

      - name: Is every published release on rimeos.com?
        id: live
        run: node scripts/sync-releases.mjs --check-live

      - name: Decide
        id: go
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.live.outputs.missing }}
        run: |
          if [ "$EVENT" != schedule ] || [ -n "$MISSING" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "every published release is live; nothing to deploy"
          fi

      - name: Write records for releases that have none
        id: sync
        if: steps.go.outputs.run == 'true'
        run: node scripts/sync-releases.mjs

      - name: Unit tests
        if: steps.go.outputs.run == 'true'
        run: npm test

      # Vendored Shell hashes, generated tokens, astro build, then the postbuild
      # gate: release pages and JSON, links and anchors, alt text, CSP-safe
      # markup, the JS budget. A generated record that fails any of it stops
      # here, before anything is deployed or kept.
      - name: Build
        if: steps.go.outputs.run == 'true'
        run: npm run build

      - name: Keep the new records on the release-records branch
        if: steps.go.outputs.run == 'true' && steps.sync.outputs.written != ''
        env:
          WRITTEN: ${{ steps.sync.outputs.written }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          rr="$RUNNER_TEMP/release-records"
          if git ls-remote --exit-code --heads origin release-records >/dev/null; then
            git fetch --no-tags origin release-records
            git worktree add "$rr" FETCH_HEAD
            git -C "$rr" checkout -B release-records
          else
            git worktree add --detach "$rr"
            git -C "$rr" checkout --orphan release-records
            git -C "$rr" rm -rq --cached . && git -C "$rr" clean -fdxq
          fi
          for id in $WRITTEN; do
            mkdir -p "$rr/content/updates/$id"
            cp "content/updates/$id/release.yaml" "$rr/content/updates/$id/release.yaml"
            git -C "$rr" add "content/updates/$id/release.yaml"
          done
          git -C "$rr" commit -qm "records: $WRITTEN (written by scripts/sync-releases.mjs)"
          git -C "$rr" push -q origin release-records
          git worktree remove --force "$rr"

      # Without the token a push or a manual run fails, where a person is
      # looking; the 15-minute check only warns, so a missing secret is not a
      # failure e-mail every quarter of an hour.
      - name: Deploy
        id: deploy
        if: steps.go.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            msg="CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) are both needed to deploy; see the top of this file"
            if [ "$EVENT" = schedule ]; then echo "::warning::$msg"; exit 0; fi
            echo "::error::$msg"; exit 1
          fi
          npx --yes wrangler@4.143.0 deploy -c deploy/wrangler.jsonc --env production
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Every published release answers on rimeos.com
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            out="$(node scripts/sync-releases.mjs --check-live)"
            echo "$out"
            case "$out" in "every published release is on"*) exit 0 ;; esac
            sleep 10
          done
          echo "::error::$out"
          exit 1
