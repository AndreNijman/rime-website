changes:
  - id: "workspace-overview"
    area: shell
    kind: new
    title: "Super+Tab shows every workspace at once"
    summary: "A card comes off the top notch with workspaces 1 to 10, each showing your wallpaper and live pictures of its windows where they actually sit. Click a window to go to it, middle-click to close it, or drag it onto another workspace to move it there."
    detail: "Click an empty part of a workspace to switch to it. Arrow keys, Return and the digits 1–0 work from the keyboard; Escape, a click outside or Super+Tab again closes it. The line at the top says what the pointer is on, or where a dragged window will land. It is Hyprland's own window pictures, captured only while the overview is open."
    source: ["https://github.com/AndreNijman/rime-shell/pull/31"]
    breaking: false
  - id: "layout-menu"
    area: shell
    kind: improved
    title: "The window-layout button shows the layout and asks before changing it"
    summary: "The button beside the workspaces used to show `><` and change the layout on every click. It is now a small picture of the current layout, and a click opens a menu that names each layout — Split, Main + stack, One at a time, Scrolling — with a line on what it does."
    detail: "One at a time says that Alt+Tab is how you reach the other windows (Super+arrows do nothing in that layout). The layout you choose is remembered across a reload and a login, and applies to every workspace."
    source: ["https://github.com/AndreNijman/rime-shell/pull/30"]
    breaking: false
  - id: "whats-new"
    area: system
    kind: new
    title: "After an update, Rime opens the page that says what changed"
    summary: "The first time you log in after an update, Rime opens this page in your default browser — once, and with the releases you skipped included. A rollback shows a small notice instead, and a fresh install shows nothing."
    detail: "If the page is not up yet, or the computer is offline, it waits and opens it later. Turn it off in Settings → Misc → Updates (\"Open what's new after an update\"); you then get a notification with a \"See what changed\" button instead. Nothing is sent anywhere: the only request is for the page itself."
    source: ["https://github.com/AndreNijman/rime-shell/pull/32", "https://github.com/AndreNijman/rime-os/pull/72"]
    breaking: false
  - id: "alt-tab"
    area: shell
    kind: fixed
    title: "Alt+Tab switches windows again"
    summary: "The window switcher did nothing when you pressed Alt+Tab: the shell's handler could not reach the switcher. It has been broken since the switcher was added."
    source: ["https://github.com/AndreNijman/rime-shell/pull/30"]
    breaking: false
  - id: "window-close-move"
    area: shell
    kind: fixed
    title: "Closing a window from the launcher, and moving windows between workspaces, work"
    summary: "Both used Hyprland commands that its current version no longer has, so they did nothing."
    source: ["https://github.com/AndreNijman/rime-shell/pull/31"]
    breaking: false
  - id: "frame-corners"
    area: shell
    kind: fixed
    title: "The frame's top corners meet the notches without a bump"
    summary: "Where the screen frame curves down from each top notch there was a one-pixel ledge, most visible after a fullscreen game or video. The curve now runs cleanly out of the notch's edge."
    source: ["https://github.com/AndreNijman/rime-shell/pull/30"]
    breaking: false
