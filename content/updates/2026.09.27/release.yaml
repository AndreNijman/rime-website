  - id: "super-drag-fixed"
    area: shell
    kind: fixed
    title: "SUPER+drag moves and resizes windows again"
    summary: "Holding SUPER and dragging with the left mouse button moves a window, and with the right button resizes it. Both had done nothing since the desktop's Hyprland configuration moved to Lua."
    detail: "The two binds were declared so that they fired only when the mouse button was released, while moving and resizing act on the press. They now use Hyprland's mouse-bind form, and both the config migrator and the image build refuse the broken form."
    source: ["https://github.com/AndreNijman/rime-os/pull/65"]
    breaking: false
knownIssues:
  - title: "Already-migrated configs keep the broken binds"
    summary: "If your Hyprland config was migrated from the old format, your own ~/.config/hypr/apex/user-overrides.lua still declares SUPER+drag with `{ drag = true }`, and the migrator does not run again. Changing those two binds to `{ mouse = true }` fixes them."
    source: ["https://github.com/AndreNijman/rime-os/pull/65"]
