changes:
  - id: "keyring-at-login"
    area: system
    kind: fixed
    title: "On a new install, logging in unlocks the keyring"
    summary: "The password you type at the login screen never reached the keyring, so the first app that needed it asked for the password again. A new install now opens its keyring at login."
    detail: "A computer that already has a keyring may still be asked once more after this update. The next update moves an existing keyring over as well."
    source: ["https://github.com/AndreNijman/rime-os/pull/74"]
    breaking: false
  - id: "agent-image-paste"
    area: agents
    kind: fixed
    title: "Pasting an image into an agent works"
    summary: "Pasting a screenshot into Claude Code did nothing: agent sessions could not reach your desktop's clipboard. Sessions without a sandbox now can. Sandboxed sessions still cannot, by design."
    source: ["https://github.com/AndreNijman/rime-os/pull/74"]
    breaking: false
  - id: "compositor-pin"
    area: shell
    kind: fixed
    title: "A compositor setting can no longer hide the workspace dots, the layout button and Super+Tab"
    summary: "Choosing Scrolling under Settings → Misc → Compositor while on the Tiling desktop made the shell talk to a compositor that was not running. The bar lost its workspace dots and layout button, and Super+Tab did nothing. That setting now only applies while its compositor is the one running, and Settings says when it is being ignored."
    detail: "This setting never changed how windows are arranged. That is the layout button in the bar, or the desktop you pick at login."
    source: ["https://github.com/AndreNijman/rime-shell/pull/33"]
    breaking: false
