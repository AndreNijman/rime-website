id: "2026.09.28"
product: apex
name: "APEX-OS 2026.09.28"
title: "Games on the discrete GPU, a Gaming Mode freeze fix, and a faster offline first boot"
date: "2026-09-27T17:44:44Z"
channels: ["apex", "daily", "edge", "gaming-mesa", "gaming-nvidia", "platform-apex", "platform-daily", "platform-gaming-mesa", "platform-gaming-nvidia"]
summary: "Steam and its games start on the discrete GPU, Gaming Mode no longer stalls for half a minute at a time, an offline first boot no longer waits minutes on Flathub, and the login screen types in the lock screen's shapes. This update rebuilds the image's core layer, so it is a larger download than usual."
predecessor: "2026.09.27.3"
provenance:
  osRevision: "1094c4327e3596cfbe9a9e4869b88f939e0c4aa1"
  shellRevision: "f7472250f8cae6d5234b885451fba06ef0d0ac42"
