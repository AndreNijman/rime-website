changes:
  - id: "rename-rime-os"
    area: system
    kind: new
    title: "APEX-OS is now Rime OS, and APEX Shell is now Rime Shell"
    summary: "The system, the shell, the boot splash wordmark (RIME OS) and the image carry the new name. The command is now `rime`; `apex` still works and prints a one-line note that the command is now `rime`."
    detail: "The note goes to stderr only, so scripts and tools that read `apex` output keep working. The old names of 21 service units, 47 helper programs and the old /usr/share paths are kept as aliases. Some names stay as they were so existing machines and paired phones keep working: the APEX folder on the EFI system partition and the 'APEX-OS Primary' firmware boot entry, the Rime Remote pairing scheme, relay and wire labels, backup formats, and the `apex` image tag (with `rime` added beside it)."
    source: ["https://github.com/AndreNijman/rime-os/pull/71", "https://github.com/AndreNijman/rime-shell/pull/29", "https://github.com/AndreNijman/rime-os/commit/5e336fc9ea29032e81830182fe44645538d707f3", "https://github.com/AndreNijman/rime-os/commit/ffb822d58325706bd9dbbf5fe7da6c26dd52884b"]
    breaking: false
  - id: "system-migration"
    area: system
    kind: new
    title: "The first boot moves system state to the new names"
    summary: "A one-time service moves APEX's state and settings (/var/lib/apex* and /etc/apex*) to their Rime names, re-points which services are enabled, renames a saved Rime Remote firewall exception, and updates the login screen's remembered session to its new name."
    source: ["https://github.com/AndreNijman/rime-os/pull/71", "https://github.com/AndreNijman/rime-os/commit/fc966f52c16cebd793c7e8d7e82872a48b47ecf5", "https://github.com/AndreNijman/rime-os/commit/2dcafd526ffd52be0dc04d2f37a2da257005c0c6"]
    breaking: false
  - id: "session-migration"
    area: shell
    kind: new
    title: "Your first login moves your desktop settings to the new names"
    summary: "Your apex folders under ~/.config and the other XDG directories, ~/.config/hypr/apex, the shell's config, cache and state, and your user services move to their Rime names. The shell's old directories are left behind as links, and its migration never overwrites anything."
    detail: "Your own files are rewritten only where an old name stops working. Because this release keeps every old name as an alias, Hyprland binds, niri's autostart, labwc commands and menus, and ~/.zshrc are left as they are. Quickshell IPC calls are the exception: they move to /usr/share/rime-shell now, and hypridle's lock command becomes a chain that tries the APEX path and then the Rime one, so the idle lock works on either image. On the first start the shell waits up to 2 seconds for its own migration; after that it starts without waiting."
    source: ["https://github.com/AndreNijman/rime-os/pull/71", "https://github.com/AndreNijman/rime-shell/pull/29", "https://github.com/AndreNijman/rime-os/commit/fb2a37e9e662bc438c1e279d5707c44150c4d1ce", "https://github.com/AndreNijman/rime-os/commit/18ba2f4b723dd4de4e68ddc14ee5e076f6525007"]
