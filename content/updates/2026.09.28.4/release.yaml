rollback: >-
  A rollback to APEX keeps working (found by booting the test image in a VM,
  then rolling back). The secret store stays at /var/lib/apex-secretd: APEX's
  apex-secretd.service refuses a symlinked StateDirectory, so
  rime-secretd.service declares StateDirectory=apex-secretd:rime-secretd and
  systemd links the new name to it. Users' files are rewritten only where the
  old name stops working on this image. This release carries every old name as
  an alias, so hyprland.lua binds, niri's autostart, labwc commands and menus,
  and ~/.zshrc are left as they are and work on both images; a later release
  that drops an alias rewrites what uses it. Quickshell IPC calls are the
  exception (quickshell finds an instance by the path as given, so the alias
  cannot carry them): they move to /usr/share/rime-shell now, and in
  hypridle.conf they become `qs -c /usr/share/apex-shell … || qs -c
  /usr/share/rime-shell …` so the idle lock works on both. The generated
  Hyprland keybinds keep the APEX shell's APEX-SHELL-GENERATED marker, so after
  a rollback APEX regenerates the file instead of moving it into
  shell-keybinds-user.lua, where it had required itself (every bind registered
  63 times). A stale copy loaded under another name binds nothing. On niri, a
  rollback lets APEX's first-run step append its own include block; the next
  Rime login removes it again, so round trips do not stack blocks. Known limits
  of a rollback: a user's own `qs -p /usr/share/apex-shell` bind in labwc or
  niri is rewritten and does nothing on APEX; labwc keybinds re-saved on Rime
  run `rime shell …`; after a package change on Rime, a rollback merges both
  apex-user.raw and rime-user.raw.
