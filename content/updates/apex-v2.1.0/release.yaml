    url: "https://github.com/AndreNijman/rime-os/releases/download/v2.1.0/apex-os-netinstall-x86_64.iso"
requirements:
  - "A 64-bit PC with UEFI. Legacy BIOS can also boot the stick."
  - "At least 16 GB of disk. If the target disk is the machine's only drive, it needs about 53 GB, because the download is staged on it. Otherwise a second drive or USB stick with 32 GB free is used as scratch space, and it is not erased."
  - "A network connection during the install."
highlights: ["passphrase-prompt-visible", "console-switch-safe"]
changes:
  - id: "passphrase-prompt-visible"
    area: system
    kind: fixed
    title: "The disk passphrase prompt is visible again"
    summary: "On an encrypted install, the boot screen dimmed its star and drew nothing else: no prompt, no dots as you type, no keyboard hint. It now shows the prompt, the dots, the keyboard layout in use, and a reminder that the recovery key works there too."
    detail: "The boot splash was missing the component that draws text, so every word on it was blank."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0", "https://github.com/AndreNijman/rime-os/pull/60"]
    breaking: false
  - id: "console-switch-safe"
    area: system
    kind: fixed
    title: "Switching to a text console can no longer wreck an install"
    summary: "Pressing Ctrl+Alt+F2 while the installer was open could crash its display; the installer restarted from the first page while the install carried on unseen. Now the installer's screen comes back by itself and reconnects to the install in progress, then shows the normal final page, recovery key included."
    detail: "A second install on the same machine is refused before it touches anything. An install whose screen crashed now finishes as a success; before, it could report 'failed' on its very last step, on a disk that was completely installed."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0", "https://github.com/AndreNijman/rime-os/pull/61"]
    breaking: false
  - id: "iso-image-kept"
    area: system
    kind: fixed
    title: "Published ISOs keep working"
    summary: "Each release's image now gets a permanent tag, so registry cleanup can never remove the build an ISO downloads."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0", "https://github.com/AndreNijman/rime-os/pull/61"]
    breaking: false
knownIssues:
  - title: "Some networks and adapters don't work in the installer"
    summary: "Captive-portal Wi-Fi doesn't work in the installer, and neither do USB Wi-Fi adapters that need out-of-tree drivers."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0"]
  - title: "Tablets without a keyboard cannot finish the account page"
    summary: "Tablets without a keyboard can't complete the account page."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0"]
