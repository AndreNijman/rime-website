id: "apex-v2.1.0"
product: apex
name: "APEX-OS v2.1.0"
title: "A visible unlock prompt, and an installer that survives its screen"
date: "2026-09-26T02:47:43Z"
channels: []
summary: "Fixes the two known issues v2.0.0 shipped with. The ISO was installed and booted end to end in a VM, including killing the installer's display partway through an install, before it was published. Machines already running APEX-OS get the boot-screen fix through `sudo apex update`."
predecessor: "apex-v2.0.0"
