  iso: null
highlights: ["accept-both-signers", "follow-renamed-image"]
changes:
  - id: "accept-both-signers"
    area: security
    kind: security
    title: "The update check accepts both the old and the new build identity"
    summary: "Image signatures name the repository that built them, so renaming the repository changes the signer of every later image. The update check now accepts images signed by either the apex-os or the rime-os build workflow, so a machine keeps verifying and updating across the rename."
    detail: "A trust override may list several signers and still replaces the defaults. `apex trust --json` keeps expectedSigner and adds expectedSigners."
    source: ["https://github.com/AndreNijman/rime-os/pull/70"]
    breaking: false
  - id: "follow-renamed-image"
    area: system
    kind: new
    title: "Updates move a machine to the new image name"
    summary: "The registry does not redirect a renamed image. `apex update` now moves a machine that tracks a tag of ghcr.io/andrenijman/apex-os to the same tag of ghcr.io/andrenijman/rime-os, once the new name serves that tag."
    detail: "The move uses `bootc switch`, and the trust check verifies the name being deployed. If the switch fails, the update checks and upgrades under the old name as before. A machine pinned to a digest, or following a fork's image, never moves."
    source: ["https://github.com/AndreNijman/rime-os/pull/70"]
    breaking: false
  - id: "publish-both-names"
    area: system
    kind: new
    title: "Every image is published under both names"
    summary: "Each build is published as ghcr.io/andrenijman/apex-os and ghcr.io/andrenijman/rime-os, with the same digest and tags, and a signature and SBOM attestation made under each name."
    source: ["https://github.com/AndreNijman/rime-os/pull/70", "https://github.com/AndreNijman/rime-os/actions/runs/36372134350"]
    breaking: false
knownIssues:
  - title: "Machines on images built before 2026-09-23 refuse this update"
    summary: "Every build since 2026.09.28.2 carries an SBOM attestation, which an older update check misreads and refuses. A machine on an image built before 2026-09-23 needs `provenance=off` in /etc/apex/trust.conf for one update, which brings the fixed check."
    source: ["https://github.com/AndreNijman/rime-os/pull/69", "https://github.com/AndreNijman/rime-os/commit/dd56a92f15c73997b08c5e02ca046b88f472044b"]
