name: "APEX-OS 2026.09.28.3"
title: "Preparing machines for the Rime OS name"
date: "2026-09-28T03:37:42Z"
channels: ["apex", "daily", "edge", "gaming-mesa", "gaming-nvidia", "platform-apex", "platform-daily", "platform-gaming-mesa", "platform-gaming-nvidia"]
summary: "The last APEX-OS release before the rename. It teaches machines to trust images from the renamed repository and to follow the image to its new name, so updates keep arriving after the rename. Nothing is renamed yet."
predecessor: "2026.09.28.2"
