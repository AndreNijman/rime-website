    title: "Games run faster, and Gaming Mode switches to and from the desktop in about a second"
    summary: "Games run faster on Rime. Windows games use the kernel's NT synchronisation driver. Gaming Mode switches off laptop power saving for the session. Laptops with a tuned Rime profile run the processor at its rated power instead of a lower firmware limit."
    source:
      - "https://github.com/AndreNijman/rime-os/pull/92"
    breaking: false
  - id: "cooler-boost-and-fan-control-on-msi-laptops"
    area: "system"
    kind: "improved"
    title: "Cooler Boost and fan control on MSI laptops"
    summary: "Rime can now control the fans and Cooler Boost on many more MSI laptops (rime fan mode max / auto). On a laptop whose Rime profile sets a battery charge limit, the limit now takes effect, so the battery stops charging at 80 %."
    source:
      - "https://github.com/AndreNijman/rime-os/pull/93"
    breaking: false
  - id: "gaming-mode-switches-to-and-from-the-desktop-wit"
    area: "shell"
    kind: "improved"
    title: "Gaming Mode switches to and from the desktop without the login screen"
    summary: "Switching to Gaming Mode from the power menu no longer goes through the login screen, and quitting Steam brings you back to the desktop you came from."
