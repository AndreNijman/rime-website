  - id: "keyring-login-master"
    area: security
    kind: fixed
    title: "Logging in unlocks the keyring you already have"
    summary: "Rime computers kept saved passwords in a keyring that logging in never opened, so the first app to need one asked for the keyring's password. At your first login after this update, if your login password opens that keyring, it becomes your login keyring, with nothing in it changed, and every login from then on unlocks it."
    detail: "If you gave the keyring a different password, it asks one more time. Tick \"Automatically unlock this keyring whenever I'm logged in\" in that prompt, and your login opens it from then on. To see what happened at your login, run: journalctl -t rime-keyring-login"
