name: "APEX-OS v1.0.0"
title: "First stable release"
date: "2026-07-29T18:28:54Z"
channels: []
summary: "The first release where a clean install boots straight to a working desktop with nothing to fix by hand. The shell now ships inside the OS image, so one update moves the OS and the desktop together, and updates never install or reboot on their own."
predecessor: "apex-v0.1.0"
