name: "APEX-OS v2.0.0"
title: "One image, encrypted by default"
date: "2026-09-25T23:38:00Z"
channels: []
summary: "The installer for APEX-OS as it is today: one image for every machine, disk encryption on by default, and an installer that was installed and booted end to end from this exact ISO before it was published. Machines already running APEX-OS do not need it; `sudo apex update` keeps them current."
