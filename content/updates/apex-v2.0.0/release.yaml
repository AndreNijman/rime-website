requirements:
  - "A 64-bit PC with UEFI (legacy BIOS can boot the stick)."
  - "At least 16 GB of disk. If the target disk is the machine's only drive, it needs about 53 GB, because the download is staged on it; otherwise a second drive or USB stick with 32 GB free is used as scratch and is not erased."
  - "Network during the install: Ethernet, Wi-Fi, or phone tethering."
highlights: ["one-image", "disk-encryption-default", "erase-binds-to-device", "pinned-tested-image"]
changes:
  - id: "one-image"
    area: system
    kind: improved
    title: "One image for every machine"
    summary: "The Daily and Gaming editions became one. The ISO installs ghcr.io/andrenijman/apex-os:apex and the machine updates from that tag."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "pinned-tested-image"
    area: security
    kind: security
    title: "The ISO installs the exact build it was tested with"
    summary: "The ISO downloads one pinned image, and the ISO build refuses it unless it carries the signature of APEX's own build pipeline. The first `sudo apex update` after installing brings the system current."
    detail: "Pinned image: sha256:a754443eb15460c58e81de9198e952490c7ca55242e129b5b5952bdd05f5bcdd."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "disk-encryption-default"
    area: security
    kind: new
    title: "Whole-disk encryption is on by default"
    summary: "Installs use LUKS2 whole-disk encryption. A recovery key is shown at the end, and Reboot stays locked until you tick that you have written it down."
    detail: "The unlock prompt names your keyboard layout, and the recovery key works at that prompt too."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "keyboard-timezone-first"
    area: system
    kind: improved
    title: "Keyboard and time zone come first"
    summary: "You pick them before setting passwords, so passwords are typed on the layout you will use. Both carry into the installed system."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "erase-binds-to-device"
    area: security
    kind: security
    title: "ERASE means this disk"
    summary: "The confirm page records each disk's serial, size and partition IDs, and the installer checks them again just before its first write. A USB drive that is unplugged or swapped during the download cannot be erased in its place."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "single-disk-laptops"
    area: system
    kind: fixed
    title: "Single-disk laptops can be installed"
    summary: "With no second drive, the download is staged on the disk being installed to, never in RAM."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "secure-boot-enrolment"
    area: security
    kind: improved
    title: "Secure Boot key enrolment is offered again"
    summary: "The installer offers to enrol the Secure Boot key, so Secure Boot can be switched on later without reinstalling."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
  - id: "installer-scratch-space"
    area: system
    kind: fixed
    title: "Network installs no longer fail at 'Preparing the installer runtime'"
    summary: "A network install could download the OS and then fail because the USB session's scratch space filled up, with no error shown. Found by installing from this ISO in a VM, fixed and re-verified before release."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/58"]
    breaking: false
knownIssues:
  - title: "Switching to a text console restarts the installer"
    summary: "Don't press Ctrl+Alt+F2 while the installer window is open: it restarts the installer from the first page. Fixed in v2.1.0."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/releases/tag/v2.1.0"]
  - title: "The boot splash may not show the passphrase box"
    summary: "On an encrypted install, type your passphrase and press Enter anyway, or press Esc to see the text prompt. The fix reaches installed machines through `apex update`."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0", "https://github.com/AndreNijman/rime-os/pull/60"]
  - title: "Some networks and adapters don't work in the installer"
    summary: "Captive-portal Wi-Fi and USB Wi-Fi adapters that need out-of-tree drivers don't work in the installer."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0"]
  - title: "Tablets without a keyboard cannot finish the account page"
    summary: "There is no way to complete the account page without a keyboard."
    source: ["https://github.com/AndreNijman/rime-os/releases/tag/v2.0.0"]
